<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>The Generals – Settings</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    transition: background 0.5s, color 0.5s;
    background: #0b0f1a;
    color: #e5e7eb;
  }

  header {
    background: #020617;
    padding: 20px;
    text-align: center;
  }

  header h1 {
    margin: 0;
  }

  button {
    padding: 10px 20px;
    font-size: 16px;
    cursor: pointer;
    border-radius: 8px;
    border: none;
    background: #38bdf8;
    color: #000;
    font-weight: bold;
    margin: 5px;
  }

  /* Settings popup */
  .settings-popup {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: #020617;
    color: #e5e7eb;
    padding: 30px;
    border-radius: 15px;
    display: none;
    z-index: 1000;
    min-width: 250px;
    text-align: center;
  }

  .settings-popup.light {
    background: #fff;
    color: #000;
  }

  .overlay {
    position: fixed;
    top:0;
    left:0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.5);
    display: none;
    z-index: 500;
  }

  .option-buttons button {
    display: block;
    width: 80%;
    margin: 5px auto;
  }
</style>
</head>
<body>

<header>
  <h1>The Generals</h1>
  <button onclick="openSettings()">⚙️ Settings</button>
</header>

<div class="overlay" id="overlay" onclick="closeSettings()"></div>

<div class="settings-popup" id="settingsPopup">
  <h2>Settings</h2>
  <p>Background:</p>
  <button onclick="setBackground('dark')">Dark</button>
  <button onclick="setBackground('light')">Light</button>

  <p>Options:</p>
  <div class="option-buttons">
    <button onclick="selectOption(1)">1</button>
    <button onclick="selectOption(2)">2</button>
    <button onclick="selectOption(3)">3</button>
    <button onclick="selectOption(4)">4</button>
    <button onclick="selectOption(5)">5</button>
  </div>

  <button onclick="closeSettings()">Close</button>
</div>

<script>
function openSettings() {
  document.getElementById('settingsPopup').style.display = 'block';
  document.getElementById('overlay').style.display = 'block';
}

function closeSettings() {
  document.getElementById('settingsPopup').style.display = 'none';
  document.getElementById('overlay').style.display = 'none';
}

function setBackground(mode) {
  if(mode === 'dark') {
    document.body.style.background = '#0b0f1a';
    document.body.style.color = '#e5e7eb';
    document.getElementById('settingsPopup').classList.remove('light');
  } else {
    document.body.style.background = '#fff';
    document.body.style.color = '#000';
    document.getElementById('settingsPopup').classList.add('light');
  }
}

function selectOption(num) {
  alert('Option ' + num + ' selected!');
  // You can add more functionality here based on the option
}
</script>

</body>
</html>
