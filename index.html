<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>The Generals</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow: hidden;
  font-family: Arial, sans-serif;
}

/* iframe = your existing site */
iframe {
  width: 100%;
  height: 100%;
  border: none;
}

/* settings button */
#settingsBtn {
  position: fixed;
  top: 15px;
  right: 15px;
  z-index: 1000;
  font-size: 22px;
  padding: 10px;
  border-radius: 50%;
  border: none;
  cursor: pointer;
  background: #38bdf8;
}

/* overlay */
#settingsOverlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  display: none;
  z-index: 998;
}

/* settings panel */
#settingsPanel {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: #020617;
  color: white;
  padding: 25px;
  border-radius: 15px;
  display: none;
  z-index: 999;
  width: 260px;
  text-align: center;
}

#settingsPanel button {
  margin: 5px;
  padding: 8px 14px;
  border-radius: 8px;
  border: none;
  cursor: pointer;
}

.options button {
  width: 40px;
}
</style>
</head>

<body>

<!-- YOUR ORIGINAL SITE -->
<iframe id="siteFrame" src="https://6aich.github.io/the-generals/"></iframe>

<!-- SETTINGS BUTTON -->
<button id="settingsBtn">⚙️</button>

<!-- SETTINGS UI -->
<div id="settingsOverlay"></div>

<div id="settingsPanel">
  <h2>Settings</h2>

  <p>Theme</p>
  <button onclick="setTheme('dark')">Dark</button>
  <button onclick="setTheme('light')">Light</button>

  <p>Options</p>
  <div class="options">
    <button onclick="selectOption(1)">1</button>
    <button onclick="selectOption(2)">2</button>
    <button onclick="selectOption(3)">3</button>
    <button onclick="selectOption(4)">4</button>
    <button onclick="selectOption(5)">5</button>
  </div>

  <button onclick="closeSettings()">Close</button>
</div>

<script>
const settingsBtn = document.getElementById("settingsBtn");
const settingsPanel = document.getElementById("settingsPanel");
const settingsOverlay = document.getElementById("settingsOverlay");
const frame = document.getElementById("siteFrame");

settingsBtn.onclick = () => {
  settingsPanel.style.display = "block";
  settingsOverlay.style.display = "block";
};

function closeSettings() {
  settingsPanel.style.display = "none";
  settingsOverlay.style.display = "none";
}

settingsOverlay.onclick = closeSettings;

function setTheme(mode) {
  if (mode === "light") {
    frame.style.filter = "invert(1) hue-rotate(180deg)";
  } else {
    frame.style.filter = "none";
  }
}

function selectOption(num) {
  alert("Option " + num + " selected");
}
</script>

</body>
</html>
